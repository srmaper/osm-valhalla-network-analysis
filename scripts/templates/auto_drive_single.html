<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自动驾驶 Demo · 单文件版</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1420; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; inset: 0; pointer-events: none;
    font: 13px/1.45 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; color: #eaf2fb;
  }
  .panel {
    position: absolute; background: rgba(11, 18, 27, .86); border: 1px solid rgba(120,170,220,.22);
    border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.45); backdrop-filter: blur(8px);
  }
  #title { left: 16px; top: 16px; padding: 10px 14px; min-width: 210px; }
  #title b { color: #7fd3ff; font-size: 14px; letter-spacing: .4px; display: block; }
  #title span { color: #93a9c0; font-size: 11px; }
  #nav { left: 50%; top: 16px; transform: translateX(-50%); display: flex; align-items: center;
    gap: 14px; padding: 12px 18px; min-width: 340px; }
  #navIcon { width: 42px; height: 42px; flex: none; }
  #navDist { font-size: 22px; font-weight: 600; letter-spacing: .5px; }
  #navText { font-size: 15px; color: #cfe2f5; }
  #navSub { font-size: 11px; color: #8ea6bd; margin-top: 2px; }
  #bottom { left: 16px; right: 16px; bottom: 16px; display: flex; align-items: center;
    gap: 20px; padding: 12px 18px; }
  #speed { font-size: 30px; font-weight: 700; color: #fff; min-width: 88px; }
  #speed small { font-size: 12px; font-weight: 400; color: #8ea6bd; margin-left: 4px; }
  .kv { min-width: 92px; }
  .kv b { display: block; font-size: 15px; color: #eaf2fb; }
  .kv span { font-size: 10px; color: #8ea6bd; }
  #barWrap { flex: 1; min-width: 120px; }
  #bar { height: 6px; border-radius: 3px; background: rgba(140,170,200,.22); overflow: hidden; }
  #barFill { height: 100%; width: 0%; background: linear-gradient(90deg,#22b8e6,#5ad1ff); }
  #score { color: #6ee7a8; font-weight: 600; }
  #hint { position: absolute; right: 16px; bottom: 92px; font-size: 11px; color: #93a9c0;
    background: rgba(11,18,27,.72); border: 1px solid rgba(120,170,220,.18);
    padding: 6px 10px; border-radius: 10px; }
  @media (max-width: 720px) {
    #nav { min-width: 0; padding: 10px 12px; gap: 10px; }
    #navDist { font-size: 17px; } #navText { font-size: 13px; }
    .kv { display: none; } #title { display: none; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div class="panel" id="title">
    <b>自动驾驶 Demo</b>
    <span>单文件 · 无需后端 · 沿 OSM 路线自动巡航</span>
  </div>
  <div class="panel" id="nav">
    <svg id="navIcon" viewBox="0 0 48 48" aria-hidden="true">
      <path id="navPath" d="" fill="none" stroke="#5ad1ff" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <div>
      <div id="navDist">--</div>
      <div id="navText">准备出发</div>
      <div id="navSub"></div>
    </div>
  </div>
  <div class="panel" id="bottom">
    <div id="speed">0<small>km/h</small></div>
    <div class="kv"><b id="remain">--</b><span>剩余里程</span></div>
    <div class="kv"><b id="eta">--</b><span>预计到达</span></div>
    <div class="kv"><b id="elapsed">00:00</b><span>已行驶</span></div>
    <div id="barWrap"><div id="bar"><div id="barFill"></div></div></div>
    <div class="kv"><b id="score">100</b><span>分数</span></div>
  </div>
  <div id="hint">空格 暂停 / 继续</div>
</div>
<script>
'use strict';

/* ---------- embedded route (OSM, © OpenStreetMap contributors) ---------- */
const ROUTE = __ROUTE_COORDS__;
const ROUTE_NAME = __ROUTE_NAME__;

/* ---------- local metric projection ---------- */
const lon0 = ROUTE[0][0], lat0 = ROUTE[0][1];
const KX = 111320 * Math.cos(lat0 * Math.PI / 180), KY = 110540;
const pts = ROUTE.map(([lon, lat]) => ({ x: (lon - lon0) * KX, y: (lat - lat0) * KY }));

/* ---------- resample to 4 m and build cumulative lengths ---------- */
function buildPath(input, step) {
  const out = [input[0]];
  let carry = 0;
  for (let i = 1; i < input.length; i++) {
    const a = input[i - 1], b = input[i];
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    if (d < 1e-6) continue;
    let t = carry;
    while (t + step <= d) {
      t += step;
      out.push({ x: a.x + (b.x - a.x) * t / d, y: a.y + (b.y - a.y) * t / d });
    }
    carry = t - d;
    carry = carry < 0 ? 0 : carry;
  }
  if (out[out.length - 1] !== input[input.length - 1]) out.push(input[input.length - 1]);
  return out;
}
const PATH = buildPath(pts, 4);
const S = [0];
for (let i = 1; i < PATH.length; i++) {
  S.push(S[i - 1] + Math.hypot(PATH[i].x - PATH[i - 1].x, PATH[i].y - PATH[i - 1].y));
}
const TOTAL = S[S.length - 1];

function posAt(s) {
  s = Math.max(0, Math.min(TOTAL, s));
  let lo = 0, hi = S.length - 1;
  while (lo + 1 < hi) {
    const mid = (lo + hi) >> 1;
    if (S[mid] <= s) lo = mid; else hi = mid;
  }
  const a = PATH[lo], b = PATH[hi];
  const span = Math.max(1e-6, S[hi] - S[lo]);
  const t = (s - S[lo]) / span;
  return {
    x: a.x + (b.x - a.x) * t,
    y: a.y + (b.y - a.y) * t,
    h: Math.atan2(b.x - a.x, b.y - a.y),
  };
}

/* ---------- maneuvers from heading changes ---------- */
function bearingAt(s) { return posAt(s).h; }
function normAngle(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
const MANEUVERS = [];
{
  const win = 26;
  let lastTurnS = -1e9;
  for (let s = 30; s < TOTAL - 25; s += 2) {
    const dh = normAngle(bearingAt(s + win) - bearingAt(s - win));
    const deg = dh * 180 / Math.PI;
    if (Math.abs(deg) > 26 && s - lastTurnS > 60) {
      MANEUVERS.push({ s, deg, type: Math.abs(deg) > 120 ? 'uturn' : deg > 0 ? 'right' : 'left' });
      lastTurnS = s;
    }
  }
  MANEUVERS.push({ s: TOTAL, deg: 0, type: 'arrive' });
}
function nextManeuver(s) { return MANEUVERS.find(m => m.s > s + 2) || MANEUVERS[MANEUVERS.length - 1]; }

/* ---------- state ---------- */
const state = { s: 0, v: 0, t: 0, playing: true, steer: 0 };
const V_BASE = 15.5;

/* ---------- canvas ---------- */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize);
resize();

function project(px, py, cam) {
  const dx = px - cam.x, dy = py - cam.y;
  const fwd = dx * Math.sin(cam.h) + dy * Math.cos(cam.h);
  const lat = dx * Math.cos(cam.h) - dy * Math.sin(cam.h);
  if (fwd <= 0.8) return null;
  const focal = H * 0.86;
  return {
    x: W / 2 + (lat / fwd) * focal,
    y: H * 0.52 + (cam.height / fwd) * focal,
    depth: fwd,
  };
}

function roadEdges(s, half) {
  const p = posAt(s);
  const nx = Math.cos(p.h), ny = -Math.sin(p.h);
  return {
    c: p,
    l: { x: p.x + nx * half, y: p.y + ny * half },
    r: { x: p.x - nx * half, y: p.y - ny * half },
    ll: { x: p.x + nx * (half + 2.6), y: p.y + ny * (half + 2.6) },
    rr: { x: p.x - nx * (half + 2.6), y: p.y - ny * (half + 2.6) },
  };
}

function quad(a, b, c, d, fill) {
  ctx.beginPath();
  ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}

/* ---------- sky / ground ---------- */
function drawBackdrop() {
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.56);
  sky.addColorStop(0, '#9fc4e3');
  sky.addColorStop(0.65, '#cfe0ee');
  sky.addColorStop(1, '#e8f0f6');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H * 0.56);

  const glow = ctx.createRadialGradient(W * 0.78, H * 0.16, 10, W * 0.78, H * 0.16, H * 0.5);
  glow.addColorStop(0, 'rgba(255,248,220,.85)');
  glow.addColorStop(1, 'rgba(255,248,220,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H * 0.6);

  const ground = ctx.createLinearGradient(0, H * 0.52, 0, H);
  ground.addColorStop(0, '#cfe0ea');
  ground.addColorStop(0.18, '#bcd4e2');
  ground.addColorStop(1, '#a8c6da');
  ctx.fillStyle = ground; ctx.fillRect(0, H * 0.52, W, H * 0.48);

  // distant shoreline silhouettes
  ctx.fillStyle = 'rgba(150,172,186,.45)';
  const hy = H * 0.515;
  for (let i = 0; i < 5; i++) {
    const cw = W * (0.16 + i * 0.03);
    const cx = (W * (i * 0.23 + 0.05)) % W;
    ctx.beginPath();
    ctx.moveTo(cx, hy);
    ctx.quadraticCurveTo(cx + cw * 0.3, hy - H * (0.02 + i * 0.006), cx + cw, hy);
    ctx.closePath(); ctx.fill();
  }
}

/* ---------- world ---------- */
function drawWorld(cam, car) {
  const half = 3.8;
  const from = Math.floor(car.s / 4) * 4;
  const horizon = Math.min(260, TOTAL - from);
  const far = from + horizon;
  const steps = [];
  for (let s = far; s >= from; s -= 4) steps.push(s);

  // ground shoulder band
  for (const s of steps) {
    const e = roadEdges(s, half + 3.1);
    const n = roadEdges(Math.max(from, s - 4), half + 3.1);
    const a = project(e.ll.x, e.ll.y, cam), b = project(e.rr.x, e.rr.y, cam);
    const c = project(n.rr.x, n.rr.y, cam), d = project(n.ll.x, n.ll.y, cam);
    if (a && b && c && d) quad(a, b, c, d, 'rgba(216,224,230,.96)');
  }
  // asphalt
  for (const s of steps) {
    const e = roadEdges(s, half);
    const n = roadEdges(Math.max(from, s - 4), half);
    const a = project(e.l.x, e.l.y, cam), b = project(e.r.x, e.r.y, cam);
    const c = project(n.r.x, n.r.y, cam), d = project(n.l.x, n.l.y, cam);
    if (a && b && c && d) {
      const k = Math.max(0.25, Math.min(1, 1.15 - (s - from) / Math.max(60, horizon)));
      quad(a, b, c, d, `rgba(59,69,82,${k.toFixed(3)})`);
    }
  }
  // lane dashes (center)
  ctx.lineCap = 'round';
  for (let s = from; s < far; s += 12) {
    const p = posAt(s), q = posAt(Math.min(TOTAL, s + 5));
    const A = project(p.x, p.y, cam), B = project(q.x, q.y, cam);
    if (!A || !B) continue;
    const fade = Math.max(0.15, Math.min(0.9, 1.1 - (s - from) / Math.max(80, horizon)));
    ctx.strokeStyle = `rgba(240,244,248,${fade.toFixed(3)})`;
    ctx.lineWidth = Math.max(1, 2.6 * (1 - (s - from) / Math.max(120, horizon)));
    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
  }
  // roadside posts
  for (let s = from + 20; s < far; s += 24) {
    const p = posAt(s);
    const nx = Math.cos(p.h), ny = -Math.sin(p.h);
    for (const side of [1, -1]) {
      const P = project(p.x + nx * side * (half + 2.3), p.y + ny * side * (half + 2.3), cam);
      if (!P) continue;
      const hgt = Math.max(1.5, 26 / Math.max(6, P.depth)) * 2;
      ctx.fillStyle = 'rgba(246,249,252,.9)';
      ctx.fillRect(P.x - hgt * 0.09, P.y - hgt, hgt * 0.18, hgt);
    }
  }
  // solid edge lines
  for (const side of [1, -1]) {
    ctx.beginPath();
    let started = false;
    for (let s = from; s <= far; s += 4) {
      const p = posAt(s);
      const nx = Math.cos(p.h), ny = -Math.sin(p.h);
      const P = project(p.x + nx * side * (half - 0.25), p.y + ny * side * (half - 0.25), cam);
      if (!P) continue;
      if (!started) { ctx.moveTo(P.x, P.y); started = true; } else ctx.lineTo(P.x, P.y);
    }
    ctx.strokeStyle = 'rgba(235,240,246,.8)'; ctx.lineWidth = 2; ctx.stroke();
  }
}

function drawCar(car) {
  const cx = W / 2, cy = H * 0.735;
  const w = Math.max(64, Math.min(150, H * 0.115));
  const h = w * 0.62;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(car.steer * 0.12);

  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(0, h * 0.62, w * 0.55, h * 0.2, 0, 0, Math.PI * 2); ctx.fill();

  // wheels
  ctx.fillStyle = '#1c232c';
  ctx.fillRect(-w * 0.52, -h * 0.18, w * 0.18, h * 0.5);
  ctx.fillRect(w * 0.34, -h * 0.18, w * 0.18, h * 0.5);

  // body
  const body = ctx.createLinearGradient(0, -h * 0.6, 0, h * 0.6);
  body.addColorStop(0, '#ff7a5c');
  body.addColorStop(1, '#e04b31');
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.roundRect(-w * 0.44, -h * 0.55, w * 0.88, h * 1.1, h * 0.22);
  ctx.fill();

  // windshield + rear window
  ctx.fillStyle = 'rgba(210,236,255,.92)';
  ctx.beginPath(); ctx.roundRect(-w * 0.3, -h * 0.42, w * 0.6, h * 0.28, h * 0.1); ctx.fill();
  ctx.fillStyle = 'rgba(150,190,220,.75)';
  ctx.beginPath(); ctx.roundRect(-w * 0.26, h * 0.24, w * 0.52, h * 0.2, h * 0.08); ctx.fill();

  // tail lights
  ctx.fillStyle = '#ff3b30';
  ctx.fillRect(-w * 0.4, h * 0.34, w * 0.16, h * 0.1);
  ctx.fillRect(w * 0.24, h * 0.34, w * 0.16, h * 0.1);
  ctx.restore();
}

/* ---------- HUD ---------- */
const el = {
  navDist: document.getElementById('navDist'),
  navText: document.getElementById('navText'),
  navSub: document.getElementById('navSub'),
  navPath: document.getElementById('navPath'),
  speed: document.getElementById('speed'),
  remain: document.getElementById('remain'),
  eta: document.getElementById('eta'),
  elapsed: document.getElementById('elapsed'),
  barFill: document.getElementById('barFill'),
  score: document.getElementById('score'),
};

function arrowPath(type) {
  if (type === 'left') return 'M34 42 L18 26 L34 10';
  if (type === 'right') return 'M14 42 L30 26 L14 10';
  if (type === 'uturn') return 'M30 42 L30 20 A10 10 0 1 0 16 26';
  if (type === 'arrive') return 'M24 40 L24 10 M14 20 L24 10 L34 20';
  return 'M24 42 L24 10 M14 22 L24 10 L34 22';
}

function fmtMeters(d) {
  if (d >= 1000) return (d / 1000).toFixed(1) + ' 公里';
  return Math.max(0, Math.round(d / 10) * 10) + ' 米';
}
function fmtClock(sec) {
  sec = Math.max(0, Math.round(sec));
  return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
}

function updateHud() {
  const m = nextManeuver(state.s);
  const d = Math.max(0, m.s - state.s);
  el.navDist.textContent = m.type === 'arrive' && d < 30 ? '到达目的地' : fmtMeters(d);
  el.navText.textContent = m.type === 'arrive'
    ? (d < 30 ? '已到达终点' : '继续沿当前道路行驶')
    : m.type === 'left' ? '前方左转' : m.type === 'right' ? '前方右转' : '前方掉头';
  el.navSub.textContent = ROUTE_NAME;
  el.navPath.setAttribute('d', arrowPath(m.type));

  const kmh = state.v * 3.6;
  el.speed.innerHTML = Math.round(kmh) + '<small>km/h</small>';
  const remain = Math.max(0, TOTAL - state.s);
  el.remain.textContent = (remain / 1000).toFixed(2) + ' km';
  el.eta.textContent = fmtClock(remain / Math.max(2, state.v));
  el.elapsed.textContent = fmtClock(state.t);
  el.barFill.style.width = (100 * state.s / TOTAL).toFixed(2) + '%';
}

/* ---------- simulation ---------- */
function steeringAhead(s) {
  const a = bearingAt(s + 4), b = bearingAt(s + 22);
  return normAngle(b - a);
}

function step(dt) {
  const ahead = steeringAhead(state.s);
  const curve = Math.min(1, Math.abs(ahead) / 0.6);
  const targetV = Math.max(4.5, V_BASE * (1 - 0.62 * curve));
  const dv = targetV - state.v;
  state.v += Math.max(-6 * dt, Math.min(2.6 * dt, dv));
  state.steer += (ahead * 3 - state.steer) * Math.min(1, 6 * dt);
  state.s += state.v * dt;
  state.t += dt;
  if (state.s >= TOTAL) { state.s = TOTAL; state.v = 0; state.playing = false; }
}

const lastPos = { x: 0, y: 0, h: 0, s: 0 };
function camFollow(dt) {
  const p = posAt(state.s);
  const back = 10.5 + state.v * 0.16;
  const target = { x: p.x - Math.sin(p.h) * back, y: p.y - Math.cos(p.h) * back, h: p.h, height: 5.6 + state.v * 0.05 };
  if (!lastPos.init) { Object.assign(lastPos, target); lastPos.init = true; }
  const k = 1 - Math.exp(-dt * 7);
  lastPos.x += (target.x - lastPos.x) * k;
  lastPos.y += (target.y - lastPos.y) * k;
  let dh = normAngle(target.h - lastPos.h);
  lastPos.h += dh * (1 - Math.exp(-dt * 5));
  lastPos.height += (target.height - lastPos.height) * k;
  return lastPos;
}

let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state.playing) {
    acc += dt;
    while (acc >= 1 / 120) { step(1 / 120); acc -= 1 / 120; }
  }
  const cam = camFollow(dt);
  const car = { s: state.s, steer: state.steer };
  ctx.clearRect(0, 0, W, H);
  drawBackdrop();
  drawWorld(cam, car);
  drawCar(car);
  updateHud();
  requestAnimationFrame(frame);
}

addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (state.s >= TOTAL) { state.s = 0; state.v = 0; state.t = 0; state.playing = true; }
    else state.playing = !state.playing;
  }
  if (e.key.toLowerCase() === 'r') { state.s = 0; state.v = 0; state.t = 0; state.playing = true; }
});
addEventListener('click', () => { if (state.s < TOTAL) state.playing = !state.playing; });

requestAnimationFrame(frame);
</script>
</body>
</html>
