  if (e.code === 'Space' && state.manual) { KEY[' '] = true; e.preventDefault(); return; }
  if (e.key === 'Escape') document.getElementById('exit').click();
  if (e.code === 'Space') { e.preventDefault(); document.getElementById('play').click(); }
  if (e.key === 'f' || e.key === 'F') document.getElementById('follow').click();
  if (e.key === 'm' || e.key === 'M') document.getElementById('mute').click();
  if (e.key === 'r' || e.key === 'R') document.getElementById('reset').click();
  if (e.key === 'v' || e.key === 'V') document.getElementById('view').click();
  if (e.key === 'e' || e.key === 'E') document.getElementById('engine').click();
  if (e.key === 'b' || e.key === 'B') document.getElementById('base').click();
  if (e.key === 't' || e.key === 'T') document.getElementById('terrain').click();
});
addEventListener('keyup', e => {
  const k = (e.key || '').toLowerCase();
  const k2 = ARROW_KEY[e.key] || (e.key || '').toLowerCase();
  if ('wasd'.includes(k2) && k2.length === 1) KEY[k2] = false;
  if (e.code === 'Space') KEY[' '] = false;
});
addEventListener('blur', () => { KEY['w'] = KEY['a'] = KEY['s'] = KEY['d'] = KEY[' '] = false; });

boot();
requestAnimationFrame(tick);
</script>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

console.log('[car3d] module loaded');

function waitMap() {
  return new Promise(res => {
    const tick = () => {
      if (!window.__map) { setTimeout(tick, 200); return; }
      const m = window.__map;
      if (m.isStyleLoaded()) res(m);
      else { m.once('load', () => res(m)); setTimeout(() => res(m), 3000); }
    };
    tick();
  });
}

waitMap().then(async (map) => {
  console.log('[car3d] map ready');
  const loader = new GLTFLoader();
  const FILES = ['./models/sedan.glb', './models/sedan-sports.glb'];

  function makeCar(gltf) {
    const obj = gltf.scene;
    const box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    obj.position.sub(center);

    const holder = new THREE.Group();
    holder.add(obj);
    const scl = 4.6 / Math.max(size.x, size.z);
    holder.scale.setScalar(scl);

    /* 自动判定姿态：基向量把场景 +Y 映射为"上"，
       因此应选让场景包围盒 Y 跨度最小(=车高)的那个旋转 */
    let bestRot = null;
    for (const rx of [0, Math.PI / 2, -Math.PI / 2, Math.PI]) {
      for (const ry of [0, Math.PI]) {
        holder.rotation.set(rx, ry, 0);
        const b = new THREE.Box3().setFromObject(holder);
        const sz = b.getSize(new THREE.Vector3());
        if (!bestRot || sz.y < bestRot.sz.y - 1e-4) bestRot = { rx, ry, sz, b };
      }
    }
    holder.rotation.set(bestRot.rx, bestRot.ry, 0);
    holder.position.y -= bestRot.b.min.y;
    console.log('[car3d] pose', bestRot.rx.toFixed(2), bestRot.ry.toFixed(2),
                'h=', bestRot.sz.y.toFixed(2));

    const wheels = [];
    obj.traverse(o => {
      if (o.isMesh && /wheel/i.test(o.name)) {
        const wb = new THREE.Box3().setFromObject(o);
        const rLocal = Math.max(0.03, wb.getSize(new THREE.Vector3()).y / 2);
        wheels.push({ o, r: rLocal * scl });
      }
    });

    /* —— 车灯（模型空间：车头 -Z，车尾 +Z）—— */
    const hx = size.x / 2, hy = size.y / 2, hz = size.z / 2;
    const mkLight = (w, h, color, x, y, z, flip) => {
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, depthWrite: false })
      );
      m.position.set(x, y, z);
      if (flip) m.rotation.y = Math.PI;
      obj.add(m);
      return m;
    };
    const lights = {
      brake: [mkLight(0.40, 0.12, 0xff2d2d, hx * 0.52, hy * 0.35, hz * 1.005, false),
              mkLight(0.40, 0.12, 0xff2d2d, -hx * 0.52, hy * 0.35, hz * 1.005, false)],
      turnL: mkLight(0.14, 0.11, 0xffb020, hx * 0.90, hy * 0.32, hz * 0.99, false),
      turnR: mkLight(0.14, 0.11, 0xffb020, -hx * 0.90, hy * 0.32, hz * 0.99, false),
      head: [mkLight(0.32, 0.14, 0xfff6d0, hx * 0.58, hy * 0.35, -hz * 1.005, true),
             mkLight(0.32, 0.14, 0xfff6d0, -hx * 0.58, hy * 0.35, -hz * 1.005, true)]
    };
    return { group: holder, wheels, lights };
  }

  let cars = [];
  try {
    for (const f of FILES) cars.push(makeCar(await loader.loadAsync(f)));
  } catch (e) {
    console.warn('[car3d] model load failed', e);
    return;
  }

  const scene = new THREE.Scene();
  const amb = new THREE.AmbientLight(0xffffff, 1.5); scene.add(amb);
  const d1 = new THREE.DirectionalLight(0xffffff, 2.2); d1.position.set(1, 2, 1); scene.add(d1);
  const d2 = new THREE.DirectionalLight(0x9ec5ff, 0.8); d2.position.set(-1, 1, -1); scene.add(d2);
  cars.forEach((c, i) => { c.group.visible = i === 0; scene.add(c.group); });

  const camera = new THREE.Camera();
  const renderer = new THREE.WebGLRenderer({ canvas: map.getCanvas(), context: map.painter.context.gl, antialias: true, alpha: true });
  renderer.autoClear = false;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const st = { lon: 0, lat: 0, heading: 0, visible: false, speed: 0,
               brake: false, turn: null, night: false };
  let active = 0;

  /* ---- 引擎声（WebAudio，用户点击后启动） ---- */
  let actx = null, osc = null, gain = null, filt = null, soundOn = false;
  const apiParts = {};
  function initSound() {
    if (actx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    osc = actx.createOscillator(); osc.type = 'sawtooth';
    filt = actx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 500;
    gain = actx.createGain(); gain.gain.value = 0;
    const sub = actx.createOscillator(); sub.type = 'sine'; sub.frequency.value = 28;
    const subGain = actx.createGain(); subGain.gain.value = 0.5;
    osc.connect(filt); filt.connect(gain);
    sub.connect(subGain); subGain.connect(gain);

    /* 风噪 + 胎噪：白噪声 → 带通 */
    const len = actx.sampleRate * 2;
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const noise = actx.createBufferSource(); noise.buffer = buf; noise.loop = true;
    const nf = actx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 900; nf.Q.value = 0.7;
    const nGain = actx.createGain(); nGain.gain.value = 0;
    noise.connect(nf); nf.connect(nGain); nGain.connect(actx.destination);
    noise.start();
    apiParts.noise = { nf, nGain };

    gain.connect(actx.destination);
    osc.start(); sub.start();
  }
  function applySound() {
    if (!actx || !gain) return;
    const t = actx.currentTime;
    const v = st.speed;
    if (osc) osc.frequency.setTargetAtTime(46 + v * 3.6, t, 0.12);
    if (filt) filt.frequency.setTargetAtTime(380 + v * 26, t, 0.15);
    const on = soundOn && st.visible;
    gain.gain.setTargetAtTime(on ? 0.012 + Math.min(0.03, v * 0.0012) : 0, t, 0.15);
    if (apiParts.noise) {
      apiParts.noise.nf.frequency.setTargetAtTime(700 + v * 45, t, 0.2);
      apiParts.noise.nGain.gain.setTargetAtTime(on ? Math.min(0.05, 0.004 + v * 0.0018) : 0, t, 0.2);
    }
  }

  const carLayer = {
    id: 'car-3d',
    type: 'custom',
    renderingMode: '3d',
    render(gl, args) {
      applySound();
      const view = cars[active];
      if (view) view.group.visible = !!st.visible;
      const mc = maplibregl.MercatorCoordinate.fromLngLat([st.lon, st.lat], st.alt || 0);
      const s = mc.meterInMercatorCoordinateUnits();
      const h = st.heading * Math.PI / 180;
      const up = new THREE.Vector3(0, 0, 1);
      const fwd = new THREE.Vector3(Math.sin(h), -Math.cos(h), 0);
      const right = new THREE.Vector3().crossVectors(up, fwd).normalize();
      const back = fwd.clone().negate();
      const basis = new THREE.Matrix4().makeBasis(right, up, back);
      const tilt = new THREE.Matrix4().makeRotationZ(st.roll || 0)
        .multiply(new THREE.Matrix4().makeRotationX(st.pitch || 0));
      const model = new THREE.Matrix4()
        .makeTranslation(mc.x, mc.y, mc.z)
        .multiply(new THREE.Matrix4().makeScale(s, s, s))
        .multiply(basis)
        .multiply(tilt);
      camera.projectionMatrix = new THREE.Matrix4()
        .fromArray(args.defaultProjectionData.mainMatrix)
        .multiply(model);
      const pXY = window.__pXY || [0, 0];
      placeNpcs(pXY[0], pXY[1], st.heading);

      /* 车轮转动 */
      const now = performance.now();
      const dt = Math.min(0.1, (now - (carLayer._t || now)) / 1000);
      carLayer._t = now;
      const w = cars[active].wheels;
      if (w.length) {
        const ang = st.speed * dt / Math.max(0.1, w[0].r);
        for (const wl of w) wl.o.rotation.x -= ang;
      }
      /* 昼夜光照 */
      amb.intensity = st.night ? 0.55 : 1.5;
      d1.intensity = st.night ? 0.8 : 2.2;
      d2.intensity = st.night ? 0.5 : 0.8;

      /* 车灯 */
      const L = cars[active].lights;
      if (L) {
        for (const b of L.brake) b.material.opacity = st.brake ? 1 : 0;
        const blink = Math.floor(performance.now() / 380) % 2 === 0;
        L.turnL.material.opacity = (st.turn === 'left' && blink) ? 1 : 0;
        L.turnR.material.opacity = (st.turn === 'right' && blink) ? 1 : 0;
        for (const h of L.head) h.material.opacity = st.night ? 0.95 : 0;
      }

      applySound();

      renderer.resetState();
      renderer.render(scene, camera);
      map.triggerRepaint();
    }
  };

  const api = {
    set(lon, lat, heading, visible, speed, extra) {
      st.lon = lon; st.lat = lat; st.heading = heading;
      st.visible = visible; st.speed = speed || 0;
      if (extra) {
        st.brake = !!extra.brake;
        st.turn = extra.turn || null;
        st.night = !!extra.night;
        st.alt = extra.alt || 0;
        st.roll = extra.roll || 0;
        st.pitch = extra.pitch || 0;
      }
    },
    tune(o) { Object.assign(st, o); },
    setNpcs(list) { npcApi.set(list); },
    clearNpcs() { npcApi.clear(); clearPedsApi(); },
    setPeds(list) { setPedsApi(list); },
    clearPeds() { clearPedsApi(); },
    reAdd() {
      try { map.addLayer(carLayer); } catch (e) { }
      try { map.triggerRepaint(); } catch (e) { }
    },
    switchCar() {
      cars[active].group.visible = false;
      active = (active + 1) % cars.length;
      cars[active].group.visible = true;
      return active;
    },
    toggleSound() {
      initSound();
      if (actx && actx.state === 'suspended') actx.resume();
      soundOn = !soundOn;
      applySound();
      return soundOn;
    }
  };
  window.Car3D = api;
  window.__car3d = { scene, camera, st, cars, get active() { return active; } };

  /* ---- NPC 车：克隆玩家车模，按玩家局部坐标摆放 ---- */
  const npcGroups = [];
  function ensureNpcs(n) {
    while (npcGroups.length < n) {
      const g = cars[npcGroups.length % Math.max(1, cars.length)].group.clone(true);
      const pal = [0xdfe4ea, 0xc9d6e3, 0xbfcbbb, 0xd9ccb4, 0xe6e9ee, 0xb8c4d0];
      const col = pal[npcGroups.length % pal.length];
      g.traverse(o => {
        if (o.isMesh && o.material && o.material.color) {
          o.material = o.material.clone();
          o.material.color.setHex(col);
        }
      });
      g.visible = false;
      g.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
      scene.add(g);
      npcGroups.push(g);
    }
  }
  let npcData = [];
  const npcApi = {
    set(list) { npcData = list || []; ensureNpcs(npcData.length); },
    clear() { npcData = []; npcGroups.forEach(g => { g.visible = false; }); }
  };

  /* ---- 行人：简易人形（躯干+腿+头） ---- */
  const pedGroups = [];
  let pedData = [];
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xe0b08c, roughness: 0.6 });
  const hairMat = new THREE.MeshStandardMaterial({ color: 0x2b2118, roughness: 0.8 });
  function makePedMesh(colour, pants) {
    const g = new THREE.Group();
    const shirt = new THREE.MeshStandardMaterial({ color: colour, roughness: 0.7 });
    const legM = new THREE.MeshStandardMaterial({ color: pants, roughness: 0.8 });
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.19, 0.85, 10), shirt);
    torso.position.y = 1.15; g.add(torso);
    const legs = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.13, 0.8, 8), legM);
    legs.position.y = 0.4; g.add(legs);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 8), skinMat);
    head.position.y = 1.72; g.add(head);
    const hair = new THREE.Mesh(new THREE.SphereGeometry(0.145, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), hairMat);
    hair.position.y = 1.74; g.add(hair);
    g.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
    g.userData.shirt = shirt; g.userData.legM = legM;
    return g;
  }
  function ensurePeds(n) {
    while (pedGroups.length < n) {
      const g = makePedMesh(0xc0392b, 0x2c3e50);
      g.visible = false;
      scene.add(g);
      pedGroups.push(g);
    }
  }
  function setPedsApi(list) {
    pedData = list || [];
    ensurePeds(pedData.length);
    pedData.forEach((d, i) => {
      const g = pedGroups[i];
      if (g.userData.col !== d.colour) {
        g.userData.shirt.color.setHex(d.colour);
        g.userData.legM.color.setHex(d.pants);
        g.userData.col = d.colour;
      }
    });
  }
  function clearPedsApi() {
    pedData = [];
    pedGroups.forEach(g => { g.visible = false; });
  }

  window.__npcInfo = () => npcGroups.map(g => ({v:g.visible, x:+g.position.x.toFixed(1), z:+g.position.z.toFixed(1)})).filter(a=>a.v).slice(0,5);
  function placeNpcs(px, py, pb) {
    const cs = Math.cos(pb * Math.PI / 180), sn = Math.sin(pb * Math.PI / 180);
    for (let i = 0; i < npcGroups.length; i++) {
      const g = npcGroups[i], n = npcData[i];
      if (!n) { g.visible = false; continue; }
      const dx = n.x - px, dy = n.y - py;
      /* 世界(东,北) -> 车体局部(x=右, z=后) */
      const lx = dx * cs - dy * sn;
      const lz = -(dx * sn + dy * cs);
      g.visible = Math.hypot(lx, lz) < 220;
      g.position.set(lx, 0, lz);
      g.rotation.y = (pb - n.b) * Math.PI / 180;
    }
    for (let i = 0; i < pedGroups.length; i++) {
      const g = pedGroups[i], n = pedData[i];
      if (!n) { g.visible = false; continue; }
      const dx = n.x - px, dy = n.y - py;
      const lx = dx * cs - dy * sn;
      const lz = -(dx * sn + dy * cs);
      g.visible = Math.hypot(lx, lz) < 200;
      g.position.set(lx, 0, lz);
      g.rotation.y = (pb - n.b) * Math.PI / 180;
    }
  }

  const addOnce = (retries = 0) => {
    try {
      map.addLayer(carLayer);
      console.log('[car3d] ready');
    } catch (e) {
      if (retries < 10) setTimeout(() => addOnce(retries + 1), 400);
      else console.warn('[car3d] addLayer failed', e);
    }
  };
  addOnce();
});
</script>
