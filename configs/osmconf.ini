# OGR OSM driver configuration for road vector-tile export.
[lines]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,highway,waterway,railway,bridge,tunnel,oneway,maxspeed,lanes,ref,service,layer
ignore=created_by,converted_by,source,time,ele,note,todo,fixme,FIXME
